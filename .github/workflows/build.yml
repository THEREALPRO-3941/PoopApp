name: Build PoopApp APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            python3-virtualenv autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libtinfo6 cmake \
            libffi-dev libssl-dev automake

      - name: Install Buildozer
        run: |
          python3 -m pip install --user --upgrade buildozer
          python3 -m pip install --user cython==0.29.34

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PoopApp-APK
          path: bin/*.apk
